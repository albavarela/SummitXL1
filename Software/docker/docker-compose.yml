services:
  summitxl_real:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: summitxl_real
    network_mode: host
    extra_hosts:
      - "SXL00-200727AA:192.168.0.200"
    environment:
      - ROS_MASTER_URI=${ROS_MASTER_URI}
      - ROS_IP=${ROS_IP}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ../catkin_ws:/home/ros/catkin_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true